# SonarQube project definition. Consumed by ./scripts/sonar_scan.sh.

sonar.projectKey=movie-search-platform
sonar.projectName=Intelligent Movie Search Platform
sonar.projectVersion=1.0.0

# --- what to analyse ------------------------------------------------------------
# Three languages in one project, so Sonar can report duplication and complexity
# across the whole thing rather than per service. That cross-language view is the
# main thing it adds over ruff, mypy and the .NET analysers, which already run in
# CI and already gate the build.
sonar.sources=\
  pipeline/src,\
  mcp-server/src,\
  api/src,\
  scripts,\
  database

sonar.tests=\
  pipeline/tests,\
  mcp-server/tests,\
  api/tests

sonar.sourceEncoding=UTF-8

# --- what to leave out ----------------------------------------------------------
# Build output, virtual environments and generated files. Analysing a vendored
# dependency tells you about somebody else's code and drowns the findings that
# are yours.
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  **/.terraform/**,\
  **/*.parquet,\
  openapi.json

sonar.coverage.exclusions=\
  **/tests/**,\
  scripts/**,\
  database/**,\
  api/src/MovieSearch.Api/Program.cs

# --- coverage -------------------------------------------------------------------
# Written by the scan script before the scanner runs. Both paths are optional: if
# the file is absent Sonar reports zero coverage for that language rather than
# failing, which is why the script tells you when it skipped one.
sonar.python.coverage.reportPaths=\
  pipeline/coverage.xml,\
  mcp-server/coverage.xml

sonar.python.version=3.12

sonar.cs.opencover.reportsPaths=api/coverage/**/coverage.opencover.xml

# --- Terraform and Docker -------------------------------------------------------
# Sonar has its own IaC rules. They overlap Trivy's, and the overlap is useful:
# two tools disagreeing about a file is worth ten minutes of somebody's attention.
sonar.terraform.provider.aws.version=6.60.0
