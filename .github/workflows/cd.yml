name: CD

# Delivery runs on a push to main, after CI has passed on the same commit.
#
#   develop:  ci  ─▶  create ECR  ─▶  push images  ─▶  deploy dev
#   main:     ci  ─▶  create ECR  ─▶  push images  ─▶  deploy production
#
# One branch, one environment. A push to develop can never touch production and
# a push to main never re-runs dev, which has already been exercised on develop.
#
#   (former single-branch flow, kept for reference)
#   ci  ─▶  create ECR  ─▶  push images  ─▶  deploy dev  ─▶  smoke test dev  ─▶  approval  ─▶  deploy prod  ─▶  smoke test prod
#
# The approval gate is a GitHub environment with a required reviewer. GitHub
# holds the job until somebody approves it; nothing here has to poll or sleep.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: Also deploy to production
        type: boolean
        default: false

# Two deployments of the same environment must never overlap. This queue is not
# cancelled in progress: cancelling half of a `terraform apply` is worse than
# waiting for it.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to assume the AWS role through OIDC

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.14.0"

jobs:
  # --- 1. Everything CI does ----------------------------------------------------
  # Reusing the workflow rather than copying the steps means the two can never
  # drift apart.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs cannot ask for more than the caller grants them,
    # and the run fails at startup — before any step — if they do. So this list
    # has to cover every permission any job inside ci.yml declares:
    #
    #   security        security-events: write   to upload SARIF
    #   terraform-plan  id-token: write          to assume the AWS role by OIDC
    #
    # Adding a permission to a job in ci.yml means adding it here too.
    permissions:
      contents: read
      security-events: write
      id-token: write

  # --- 2. Create the registries the push needs ----------------------------------
  # Chicken and egg. `images` pushes into ECR, but ECR is created by Terraform in
  # `deploy-dev`, which runs after it. ECR does not create a repository on push,
  # so the first delivery into a clean account died here with
  #
  #   unknown: The repository with name 'movie-search-dev/api' does not exist
  #
  # and would have kept working on every later run, which is why the ordering
  # survived review.
  #
  # A targeted apply of the ECR module alone fixes the order without taking the
  # repositories out of Terraform's hands: no `aws ecr create-repository` to
  # drift from the configuration, no `terraform import` to remember. On every
  # run after the first this is a no-op.
  ecr:
    name: Create the ECR repositories
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-ecr-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # -target is normally a smell. It is correct here: this is a bootstrap
      # step whose whole purpose is to bring one module up before the rest of
      # the graph can be built at all.
      #
      # The dev registry is created on both branches, because it is where every
      # image is built and pushed regardless of destination. Production does not
      # rebuild; it copies the exact bytes dev was tested with, so the dev
      # registry is the source even for a production release.
      - name: Init the dev registry
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Apply the ECR module (build registry)
        working-directory: terraform/environments/dev
        run: |
          terraform apply -input=false -auto-approve -no-color \
            -target=module.platform.module.ecr \
            -var "image_tag=${{ github.sha }}"

      # The production registry has to exist before deploy-prod copies into it.
      # Its own `terraform apply` runs later in that job, which is too late:
      # ECR does not create a repository on push, so the copy would fail with
      # "The repository with name 'movie-search-prod/api' does not exist" — the
      # same ordering fault the dev path hit on its first deployment.
      - name: Init the production registry
        if: github.ref == 'refs/heads/main'
        working-directory: terraform/environments/prod
        run: terraform init -input=false

      - name: Apply the ECR module (production registry)
        if: github.ref == 'refs/heads/main'
        working-directory: terraform/environments/prod
        run: |
          terraform apply -input=false -auto-approve -no-color \
            -target=module.platform.module.ecr \
            -var "image_tag=${{ github.sha }}"

      - name: Show what exists now
        run: aws ecr describe-repositories --query 'repositories[].repositoryName' --output table

  # --- 2. Build and push the images ---------------------------------------------
  images:
    name: Push ${{ matrix.service }} to ECR
    needs: [ecr]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
          - service: mcp-server
            context: ./mcp-server
          - service: pipeline
            context: ./pipeline
          - service: migrations
            context: ./database

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Build, scan, then push — in that order, deliberately.
      #
      # ECR has scan-on-push enabled in Terraform, and that is a useful backstop,
      # but it reports *after* the image is in the registry: by then it is
      # deployable and the finding lives in a console somebody has to remember to
      # open. Scanning the local image first means a vulnerable image never
      # reaches ECR at all.
      #
      # The build runs twice. The second call is a complete cache hit, so it
      # costs seconds — and it is what produces the provenance and SBOM
      # attestations, which only exist on a registry push.
      - name: Build (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.service }}:scan-target
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan the image before it is pushed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan-target
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          # A CVE with no published fix is not actionable at build time. It is
          # still reported; it just does not block a release nobody can unblock.
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # The commit SHA is the deployable identity. `main-<sha>` exists so
          # that a human can see where an image came from.
          tags: |
            ${{ steps.ecr.outputs.registry }}/movie-search-dev/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/movie-search-dev/${{ matrix.service }}:main-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

  # --- 3. Deploy to dev -----------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    needs: [images]
    # develop only. The `dev` GitHub environment also carries a branch policy
    # that permits develop alone, so this condition and that policy have to
    # agree before anything is deployed — the workflow states the intent, the
    # environment enforces it even if the workflow is edited.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.outputs.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-dev-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      # The plan is saved and then applied, so what is applied is exactly what
      # was reviewed. Applying without a saved plan re-plans against whatever
      # the account looks like at that moment.
      - name: Plan
        working-directory: terraform/environments/dev
        run: |
          # The domain, zone, certificate and OIDC provider come from Parameter
          # Store, so the commit being deployed is the only argument left.
          terraform plan -input=false -out=dev.tfplan \
            -var "image_tag=${{ github.sha }}"

      - name: Show the plan
        working-directory: terraform/environments/dev
        run: terraform show -no-color dev.tfplan | tail -200

      - name: Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve dev.tfplan

      - name: Collect the outputs
        id: outputs
        working-directory: terraform/environments/dev
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Wait for the services to stabilise
        run: |
          for service in api mcp-server embeddings; do
            echo "waiting for $service"
            aws ecs wait services-stable \
              --cluster "${{ steps.outputs.outputs.cluster }}" \
              --services "$service"
          done

      # The schema first. The pipeline verifies that `movies.embedding` exists
      # and refuses to run without it, which is exactly what happened on the
      # first deployment into a clean account: RDS came up empty, because
      # nothing outside docker-compose had ever applied a migration.
      #
      # Flyway skips versions it has already applied, so this is safe to repeat.
      - name: Apply the database migrations
        working-directory: terraform/environments/dev
        run: |
          COMMAND="$(terraform output -raw migrations_run_task_command)"
          TASK_ARN="$(eval "$COMMAND" --query 'tasks[0].taskArn' --output text)"
          echo "started $TASK_ARN"
          "$GITHUB_WORKSPACE/scripts/wait_for_ecs_task.sh" \
            "${{ steps.outputs.outputs.cluster }}" "$TASK_ARN" \
            /ecs/movie-search-dev/migrations 900

      # The schema and the data are applied after the services are healthy,
      # because the pipeline image and the migrations both come from this commit.
      - name: Run the data pipeline
        working-directory: terraform/environments/dev
        run: |
          COMMAND="$(terraform output -raw pipeline_run_task_command)"
          TASK_ARN="$(eval "$COMMAND" --query 'tasks[0].taskArn' --output text)"
          echo "started $TASK_ARN"
          "$GITHUB_WORKSPACE/scripts/wait_for_ecs_task.sh" \
            "${{ steps.outputs.outputs.cluster }}" "$TASK_ARN" \
            /ecs/movie-search-dev/pipeline 2400

      - name: Smoke test dev
        env:
          # The MCP server has no public route by design — see the note in the
          # script. Without this the two MCP checks fail from a runner, which
          # would report a healthy deployment as broken.
          SKIP_MCP_CHECKS: "1"
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          PREFIX="$(cd terraform/environments/dev && terraform output -raw secret_prefix)"
          READER_CLIENT_SECRET="$(aws secretsmanager get-secret-value \
            --secret-id "$PREFIX/clients/reader-client" --query SecretString --output text)"
          ADMIN_CLIENT_SECRET="$(aws secretsmanager get-secret-value \
            --secret-id "$PREFIX/clients/admin-client" --query SecretString --output text)"
          export READER_CLIENT_SECRET ADMIN_CLIENT_SECRET
          export READER_CLIENT_ID=reader-client ADMIN_CLIENT_ID=admin-client
          ./scripts/smoke_test.sh

  # --- 4. Manual approval, then production -------------------------------------------
  # The gate is the `production` GitHub environment. Configure it with required
  # reviewers; the job waits for one of them before any step runs.
  deploy-prod:
    name: Deploy to production
    # `deploy-dev` is listed so that a run which does deploy dev still finishes
    # it first. On main that job is skipped, and a skipped dependency would
    # normally skip this one too — hence the explicit result checks rather than
    # a bare `needs:`. `!cancelled()` keeps a cancelled run from continuing.
    needs: [images, deploy-dev]
    if: >-
      !cancelled()
      && needs.images.result == 'success'
      && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.deploy_prod)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.outputs.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-prod-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The image that production runs is the identical image dev ran, copied
      # rather than rebuilt. Rebuilding could produce different bytes from the
      # same source.
      - name: Copy the tested image into the production registry
        run: |
          for service in api mcp-server pipeline migrations; do
            docker pull "${{ steps.ecr.outputs.registry }}/movie-search-dev/$service:${{ github.sha }}"
            docker tag \
              "${{ steps.ecr.outputs.registry }}/movie-search-dev/$service:${{ github.sha }}" \
              "${{ steps.ecr.outputs.registry }}/movie-search-prod/$service:${{ github.sha }}"
            docker push "${{ steps.ecr.outputs.registry }}/movie-search-prod/$service:${{ github.sha }}"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Init
        working-directory: terraform/environments/prod
        run: terraform init -input=false

      - name: Plan
        working-directory: terraform/environments/prod
        run: |
          terraform plan -input=false -out=prod.tfplan \
            -var "image_tag=${{ github.sha }}"

      - name: Show the plan
        working-directory: terraform/environments/prod
        run: terraform show -no-color prod.tfplan | tail -300

      - name: Apply
        working-directory: terraform/environments/prod
        run: terraform apply -input=false -auto-approve prod.tfplan

      - name: Collect the outputs
        id: outputs
        working-directory: terraform/environments/prod
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Wait for the services to stabilise
        run: |
          for service in api mcp-server embeddings; do
            aws ecs wait services-stable \
              --cluster "${{ steps.outputs.outputs.cluster }}" --services "$service"
          done

      # Production is checked without writing to it. The pipeline is run
      # separately and deliberately, because it changes data.
      - name: Apply the database migrations
        working-directory: terraform/environments/prod
        run: |
          COMMAND="$(terraform output -raw migrations_run_task_command)"
          TASK_ARN="$(eval "$COMMAND" --query 'tasks[0].taskArn' --output text)"
          echo "started $TASK_ARN"
          "$GITHUB_WORKSPACE/scripts/wait_for_ecs_task.sh" \
            "${{ steps.outputs.outputs.cluster }}" "$TASK_ARN" \
            /ecs/movie-search-prod/migrations 900

      - name: Smoke test production
        env:
          # The MCP server has no public route by design — see the note in the
          # script. Without this the two MCP checks fail from a runner, which
          # would report a healthy deployment as broken.
          SKIP_MCP_CHECKS: "1"
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          curl -fsS "$API_BASE_URL/health" | python3 -m json.tool
          curl -fsS -o /dev/null -w 'openapi %{http_code}\n' "$API_BASE_URL/openapi/v1.json"

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| API | ${{ steps.outputs.outputs.api_url }} |"
            echo "| cluster | ${{ steps.outputs.outputs.cluster }} |"
          } >> "$GITHUB_STEP_SUMMARY"
