[project]
name = "movie-search-mcp-server"
version = "1.0.0"
description = "FastMCP server exposing semantic movie search over pgvector."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.7",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "uvicorn[standard]==0.52.3",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH", "N", "W", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["fastmcp.*", "asyncpg.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are requested by name; an unused one still has an effect.
"tests/**" = ["ARG001"]
