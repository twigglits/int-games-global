[project]
name = "movie-search-pipeline"
version = "1.0.0"
description = "Cleans, imputes, augments, embeds and loads the Vega movies dataset into pgvector."
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "vega-datasets==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
# pandas ships partial stubs; a DataFrame cell is Any by nature.
disallow_any_expr = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["vega_datasets.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
